 continuum_intro_ok:0 "Begin"
 continuum_intro_present:0 "Welcome to your galaxy...continued!\n\nOnly a few years have passed. The old empires still hold their space. You are a new political entity in their galaxy - not their heir."
 continuum_intro_new:0 "Welcome to your galaxy...continued!\n\nYour people have reached FTL. The other empires still occupy their cores. The gaps between them are yours to claim."
 continuum_intro_border:0 "Welcome to your galaxy...continued!\n\nYou rise on a frontier between the old empires. They still exist. You are a new state on their doorstep."
 continuum_intro_primitive:0 "Welcome to your galaxy...continued!\n\nYour world was pre-FTL. You have reached the stars. The empires that mapped this sky still exist. You do not serve them."
 continuum_intro_crisis:0 "Welcome to your galaxy...continued!\n\nOnly a few years have passed since the crisis that scarred this galaxy. The old empires that survived still hold their cores. You are a new polity in the wreckage."
 continuum_intro_copy:0 "Welcome to your galaxy...continued!\n\nAnother empire already uses this government. They still hold their space. You are a new polity under the same banner - not their heir. You keep your name."
 continuum_intro_aged:0 "Welcome to your galaxy...continued!\n\nIt has been thousands of years since the oldest maps of them were drawn by the ancients of your people. Whatever your history, your future begins now as you have finally acquired the means to travel the stars. You have many questions but feel the answers are to be found somewhere, out there, among the stars."
